<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>پنل مدیریت کافه آرا | ARA Cafe</title>
    
    <link rel="icon" type="image/x-icon" href="images/favicon.ico">
    <link rel="shortcut icon" type="image/x-icon" href="images/favicon.ico">
    
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="admin-body">
    <div class="login-screen" id="loginScreen">
        <div class="login-box">
            <div class="login-coffee">
                <svg width="80" height="80" viewBox="0 0 80 80">
                    <circle cx="40" cy="40" r="35" fill="#3E2723" stroke="#8D6E63" stroke-width="2"/>
                    <text x="40" y="50" text-anchor="middle" fill="#D7CCC8" font-size="40">☕</text>
                </svg>
            </div>
            <h2 class="login-title">پنل مدیریت کافه آرا</h2>
            <p class="login-subtitle">ARA Cafe Admin Panel</p>
            <form class="login-form" id="loginForm">
                <div class="form-group">
                    <label for="username">نام کاربری</label>
                    <input type="text" id="username" placeholder="نام کاربری" required>
                </div>
                <div class="form-group">
                    <label for="password">رمز عبور</label>
                    <input type="password" id="password" placeholder="رمز عبور" required>
                </div>
                <div class="login-error" id="loginError"></div>
                <button type="submit" class="login-btn">
                    <span>ورود به پنل</span>
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
                </button>
            </form>
        </div>
    </div>

    <div class="admin-panel" id="adminPanel" style="display: none;">
        <header class="admin-header">
            <div class="admin-logo">
                <span>☕</span>
                <div>
                    <h2>پنل مدیریت منو</h2>
                    <span style="font-size:0.8rem;color:#8D6E63;">کافه آرا - ARA Cafe</span>
                </div>
            </div>
            <div class="admin-actions">
                <a href="index.html" class="btn-preview" target="_blank">🔍 پیش‌نمایش</a>
                <button class="btn-logout" id="logoutBtn">🚪 خروج</button>
            </div>
        </header>

        <div class="admin-content">
            <section class="add-item-section">
                <h3>➕ افزودن محصول جدید</h3>
                <form class="add-item-form" id="addItemForm">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="itemName">نام محصول *</label>
                            <input type="text" id="itemName" placeholder="نام محصول" required>
                        </div>
                        <div class="form-group">
                            <label for="itemPrice">قیمت (تومان) *</label>
                            <input type="number" id="itemPrice" placeholder="قیمت" required>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="itemCategory">دسته‌بندی *</label>
                            <select id="itemCategory" required>
                                <option value="">انتخاب کنید</option>
                                <option value="hot">☕ نوشیدنی گرم</option>
                                <option value="cold">🧊 نوشیدنی سرد</option>
                                <option value="tea">🍵 چای و دمنوش</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="itemOrder">ترتیب نمایش (عدد)</label>
                            <input type="number" id="itemOrder" placeholder="1" value="1" min="1">
                            <small style="color:#8D6E63;">عدد کمتر = نمایش زودتر</small>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="itemDescription">توضیحات</label>
                            <textarea id="itemDescription" rows="3" placeholder="توضیحات"></textarea>
                        </div>
                        <div class="form-group">
                            <label for="itemImage">📷 مسیر عکس</label>
                            <input type="text" id="itemImage" placeholder="images/products/name.jpg" dir="ltr">
                            <div id="imagePreviewContainer" style="margin-top:8px;"></div>
                        </div>
                    </div>
                    <button type="submit" class="btn-add">➕ افزودن محصول</button>
                </form>
            </section>

            <section class="products-section">
                <h3>📋 لیست محصولات</h3>
                <div class="products-filter">
                    <button class="filter-btn active" data-filter="all">همه</button>
                    <button class="filter-btn" data-filter="hot">☕ گرم</button>
                    <button class="filter-btn" data-filter="cold">🧊 سرد</button>
                    <button class="filter-btn" data-filter="tea">🍵 چای و دمنوش</button>
                </div>
                <div class="products-list" id="productsList"></div>
                <button onclick="moveUp()" style="margin-top:12px;padding:8px 16px;background:#4FC3F7;color:#fff;border:none;border-radius:8px;cursor:pointer;">⬆️ انتقال به بالا</button>
                <button onclick="moveDown()" style="margin:12px 8px 0;padding:8px 16px;background:#FF9800;color:#fff;border:none;border-radius:8px;cursor:pointer;">⬇️ انتقال به پایین</button>
            </section>
        </div>
    </div>

    <div class="modal" id="editModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>✏️ ویرایش محصول</h3>
                <button class="modal-close" id="modalClose">✕</button>
            </div>
            <form class="edit-item-form" id="editItemForm">
                <input type="hidden" id="editItemId">
                <div class="form-group">
                    <label for="editItemName">نام محصول *</label>
                    <input type="text" id="editItemName" required>
                </div>
                <div class="form-group">
                    <label for="editItemPrice">قیمت (تومان) *</label>
                    <input type="number" id="editItemPrice" required>
                </div>
                <div class="form-group">
                    <label for="editItemCategory">دسته‌بندی *</label>
                    <select id="editItemCategory" required>
                        <option value="hot">☕ نوشیدنی گرم</option>
                        <option value="cold">🧊 نوشیدنی سرد</option>
                        <option value="tea">🍵 چای و دمنوش</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="editItemOrder">ترتیب نمایش</label>
                    <input type="number" id="editItemOrder" min="1">
                </div>
                <div class="form-group">
                    <label for="editItemDescription">توضیحات</label>
                    <textarea id="editItemDescription" rows="3"></textarea>
                </div>
                <div class="form-group">
                    <label for="editItemImage">📷 مسیر عکس</label>
                    <input type="text" id="editItemImage" dir="ltr">
                </div>
                <button type="submit" class="btn-save">💾 ذخیره</button>
            </form>
        </div>
    </div>

    <script src="js/admin.js"></script>
</body>
</html>

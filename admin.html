<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>پنل مدیریت کافه آرا | ARA Cafe | ویرایش منو</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="images/favicon.ico">
    <link rel="shortcut icon" type="image/x-icon" href="images/favicon.ico">
    <link rel="apple-touch-icon" href="images/logo.png">
    
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="admin-body">
    <!-- Login Screen -->
    <div class="login-screen" id="loginScreen">
        <div class="login-box">
            <div class="login-coffee">
                <svg width="80" height="80" viewBox="0 0 80 80">
                    <circle cx="40" cy="40" r="35" fill="#3E2723" stroke="#8D6E63" stroke-width="2"/>
                    <text x="40" y="50" text-anchor="middle" fill="#D7CCC8" font-size="40">☕</text>
                </svg>
            </div>
            <h2 class="login-title">پنل مدیریت کافه آرا</h2>
            <p class="login-subtitle">ARA Cafe Admin Panel</p>
            <form class="login-form" id="loginForm">
                <div class="form-group">
                    <label for="username">نام کاربری</label>
                    <input type="text" id="username" placeholder="نام کاربری" required autocomplete="username">
                </div>
                <div class="form-group">
                    <label for="password">رمز عبور</label>
                    <input type="password" id="password" placeholder="رمز عبور" required autocomplete="current-password">
                </div>
                <div class="login-error" id="loginError"></div>
                <button type="submit" class="login-btn">
                    <span class="btn-text">ورود به پنل</span>
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M9 18l6-6-6-6"/>
                    </svg>
                </button>
            </form>
        </div>
    </div>

    <!-- Admin Panel -->
    <div class="admin-panel" id="adminPanel" style="display: none;">
        <header class="admin-header">
            <div class="admin-logo">
                <svg width="30" height="30" viewBox="0 0 40 40">
                    <circle cx="20" cy="20" r="18" fill="#3E2723" stroke="#8D6E63" stroke-width="2"/>
                    <text x="20" y="27" text-anchor="middle" fill="#D7CCC8" font-size="20">☕</text>
                </svg>
                <div>
                    <h2>پنل مدیریت منو</h2>
                    <span style="font-size: 0.8rem; color: #8D6E63;">کافه آرا - ARA Cafe</span>
                </div>
            </div>
            <div class="admin-actions">
                <a href="index.html" class="btn-preview" target="_blank">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                        <circle cx="12" cy="12" r="3"/>
                    </svg>
                    پیش‌نمایش سایت
                </a>
                <button class="btn-logout" id="logoutBtn">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/>
                        <polyline points="16 17 21 12 16 7"/>
                        <line x1="21" y1="12" x2="9" y2="12"/>
                    </svg>
                    خروج
                </button>
            </div>
        </header>

        <div class="admin-content">
            <!-- Add New Item Form -->
            <section class="add-item-section">
                <h3>➕ افزودن محصول جدید به منوی کافه آرا</h3>
                <form class="add-item-form" id="addItemForm">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="itemName">نام محصول *</label>
                            <input type="text" id="itemName" placeholder="مثال: اسپرسو" required>
                        </div>
                        <div class="form-group">
                            <label for="itemPrice">قیمت (تومان) *</label>
                            <input type="number" id="itemPrice" placeholder="مثال: ۴۵۰۰۰" required>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="itemDescription">توضیحات</label>
                            <textarea id="itemDescription" rows="3" placeholder="توضیحات محصول..."></textarea>
                        </div>
                        <div class="form-group">
                            <label for="itemCategory">دسته‌بندی *</label>
                            <select id="itemCategory" required>
                                <option value="">انتخاب کنید...</option>
                                <option value="hot">☕ نوشیدنی‌های گرم</option>
                                <option value="cold">🧊 نوشیدنی‌های سرد</option>
                                <option value="tea">🍵 چای و دمنوش</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>تصویر محصول</label>
                            <div class="image-upload-container" id="imageUploadContainer">
                                <input type="file" id="itemImage" accept="image/*" class="image-input" style="display: none;">
                                <div class="image-preview" id="imagePreview">
                                    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                                        <circle cx="8.5" cy="8.5" r="1.5"/>
                                        <polyline points="21 15 16 10 5 21"/>
                                    </svg>
                                    <span>برای آپلود عکس کلیک کنید (حداکثر ۲ مگابایت)</span>
                                </div>
                            </div>
                        </div>
                    </div>
                    <button type="submit" class="btn-add">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="12" y1="5" x2="12" y2="19"/>
                            <line x1="5" y1="12" x2="19" y2="12"/>
                        </svg>
                        افزودن محصول
                    </button>
                </form>
            </section>

            <!-- Products List -->
            <section class="products-section">
                <h3>📋 لیست محصولات کافه آرا</h3>
                <div class="products-filter">
                    <button class="filter-btn active" data-filter="all">همه</button>
                    <button class="filter-btn" data-filter="hot">☕ نوشیدنی‌های گرم</button>
                    <button class="filter-btn" data-filter="cold">🧊 نوشیدنی‌های سرد</button>
                    <button class="filter-btn" data-filter="tea">🍵 چای و دمنوش</button>
                </div>
                <div class="products-list" id="productsList">
                    <!-- محصولات با JavaScript لود می‌شوند -->
                </div>
            </section>
        </div>
    </div>

    <!-- Edit Modal -->
    <div class="modal" id="editModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>✏️ ویرایش محصول</h3>
                <button class="modal-close" id="modalClose">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"/>
                        <line x1="6" y1="6" x2="18" y2="18"/>
                    </svg>
                </button>
            </div>
            <form class="edit-item-form" id="editItemForm">
                <input type="hidden" id="editItemId">
                <div class="form-group">
                    <label for="editItemName">نام محصول *</label>
                    <input type="text" id="editItemName" required>
                </div>
                <div class="form-group">
                    <label for="editItemPrice">قیمت (تومان) *</label>
                    <input type="number" id="editItemPrice" required>
                </div>
                <div class="form-group">
                    <label for="editItemDescription">توضیحات</label>
                    <textarea id="editItemDescription" rows="3"></textarea>
                </div>
                <div class="form-group">
                    <label for="editItemCategory">دسته‌بندی *</label>
                    <select id="editItemCategory" required>
                        <option value="hot">☕ نوشیدنی‌های گرم</option>
                        <option value="cold">🧊 نوشیدنی‌های سرد</option>
                        <option value="tea">🍵 چای و دمنوش</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>تصویر محصول</label>
                    <div class="image-upload-container" id="editImageUploadContainer">
                        <input type="file" id="editItemImage" accept="image/*" class="image-input" style="display: none;">
                        <div class="image-preview" id="editImagePreview">
                            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                                <circle cx="8.5" cy="8.5" r="1.5"/>
                                <polyline points="21 15 16 10 5 21"/>
                            </svg>
                            <span>برای تغییر عکس کلیک کنید</span>
                        </div>
                    </div>
                    <input type="hidden" id="editItemImageData" value="">
                </div>
                <button type="submit" class="btn-save">💾 ذخیره تغییرات</button>
            </form>
        </div>
    </div>

    <script src="js/admin.js"></script>
</body>
</html>
